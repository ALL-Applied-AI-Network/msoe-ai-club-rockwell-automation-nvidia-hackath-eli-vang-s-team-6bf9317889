# DEFT round 1 (iter1): baseline spec with hard-case oversampling. Differences from baseline_train.yaml are
# marked "# iter1:"; everything else is identical so the control run (baseline spec, 20 epochs) is a fair comparison.
# Paths are container paths: run_brev.sh mounts this folder at /workspace.
encryption_key: tlt_encode
task: classify
results_dir: /workspace/results/iter1
train:
  resume_training_checkpoint_path: null
  pretrained_model_path: ''
  classify:
    loss: ce
    cls_weight:
    - 1.0
    - 10.0
  num_epochs: 20                  # iter1: train_hard has 1.75x the rows; val separated after 1 epoch on the baseline
  num_nodes: 1
  num_gpus: 1
  seed: 42                        # vial: reproducible baseline
  validation_interval: 1          # vial: validate every epoch so best-FAR retention can see every epoch
  checkpoint_interval: 10         # vial: must be <= num_epochs
  checkpointer:                   # vial: val_far saturated at 0% after epoch 0 on the baseline, so keep best val_loss instead
    enable_topk: true
    replace_periodic: false
    monitor: val_loss
    mode: min
    save_top_k: 1
    filename: model_best_{epoch:03d}
    dirpath: ''
    auto_insert_metric_name: false
  optim:
    lr: 1.0e-05
    optim: adamw
    policy: linear
    momentum: 0.9
    weight_decay: 0.01
  results_dir: ${results_dir}/train
  tensorboard:
    enabled: true
    infrequent_logging_frequency: 1
model:
  backbone:
    type: c_radio_v2_vit_base_patch16_224
    pretrained_backbone_path: /data/pretrained_models/C-RADIOv2_B.safetensors
    freeze_backbone: false
  classify:
    train_margin_euclid: 2.0
    eval_margin: 0.3
    embedding_vectors: 5
    embed_dec: 30
    difference_module: learnable
    learnable_difference_modules: 4
  decode_head:
    use_summary_token: true
    feature_strides:
    - 4
    - 8
    - 16
    - 32
dataset:
  classify:
    train_dataset:
      csv_path: /workspace/data/vcn/train_hard.csv  # iter1: crooked_cap x3, G19-G30 x2 (from baseline val scores)
      images_dir: /workspace/data/vcn/images      # vial
    validation_dataset:
      csv_path: /workspace/data/vcn/val.csv       # vial: scenes held out of train, never test
      images_dir: /workspace/data/vcn/images
    test_dataset:
      csv_path: /workspace/data/vcn/test.csv      # vial: final report only
      images_dir: /workspace/data/vcn/images
    infer_dataset:
      csv_path: /workspace/data/vcn/val.csv       # overridden per run by run_brev.sh
      images_dir: /workspace/data/vcn/images
    image_ext: .png                               # vial: crops are PNG
    batch_size: 16
    workers: 8                                    # vial: plenty of CPU on Brev
    fpratio_sampling: 0.25
    num_input: 1
    input_map:
      SolderLight: 0
    concat_type: linear
    grid_map:
      x: 2
      y: 2
    image_width: 224                              # 40x40 crops are upsampled by the loader
    image_height: 224
    augmentation_config:
      rgb_input_mean:
      - 0.485
      - 0.456
      - 0.406
      rgb_input_std:
      - 0.229
      - 0.224
      - 0.225
      random_flip:
        vflip_probability: 0.5
        hflip_probability: 0.5
        enable: true
      random_rotate:
        rotate_probability: 0.5
        angle_list:
        - 90
        - 180
        - 270
        enable: true
      random_color:
        brightness: 0.3
        contrast: 0.3
        saturation: 0.3
        hue: 0.05                                 # vial: cap yellow is signal, keep hue shifts small
        enable: true
      with_scale_random_crop:
        enable: true
      with_random_crop: true
      with_random_blur: true
      augment: true
    num_classes: 2
evaluate:
  checkpoint: ''
  trt_engine: ${results_dir}/gen_trt_engine/changenet-classify.trt
  batch_size: ${dataset.classify.batch_size}
inference:
  checkpoint: ''
  trt_engine: ${results_dir}/gen_trt_engine/changenet-classify.trt
  batch_size: ${dataset.classify.batch_size}
export:
  gpu_id: 0
  checkpoint: ''
  onnx_file: ${results_dir}/export/changenet-classify.onnx
  input_width: 224
  input_height: 224
  batch_size: ${dataset.classify.batch_size}
